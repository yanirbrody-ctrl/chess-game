<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess workshop</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="layout">
      <section class="frame" aria-label="Chess board"><div id="board"></div></section>
      <aside>
        <h2 id="turn">White to move</h2>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="controls">
          <button data-action="new" data-opponent="human">New game: two players</button>
          <button data-action="new" data-opponent="computer">New game: play the computer</button>
          <button id="undo" data-action="undo" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            Undo
          </button>
        </div>
        <div id="files">
          <button id="save" title="Save game" aria-label="Save game">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
              <path d="M7 3v5h8V3M7 21v-7h10v7"/>
            </svg>
          </button>
          <button id="load" title="Load game" aria-label="Load game">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 18.5V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2"/>
              <path d="M3 18.5 6.1 11.4A1.5 1.5 0 0 1 7.5 10.5h13a1 1 0 0 1 .9 1.4l-2.9 6.5a1.5 1.5 0 0 1-1.4.9H4.5A1.5 1.5 0 0 1 3 18.5z"/>
            </svg>
          </button>
          <input id="load-file" type="file" accept=".json,application/json" hidden>
        </div>
        <p id="undo-caption"></p>
        <section id="captured-panel" hidden><h3>Captured pieces</h3><p id="captured"></p></section>
        <h3>Moves</h3><ol id="moves"></ol>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
